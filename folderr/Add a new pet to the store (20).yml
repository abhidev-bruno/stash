info:
  name: Add a new pet to the store (20)
  type: http
  seq: 21
  tags:
    - pet
    - newpet

http:
  method: POST
  url: "{{baseUrl}}/pet"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": 0,
        "category": {
          "id": 0,
          "name": "string"
        },
        "name": "{{petName}}",
        "photoUrls": [
          "string"
        ],
        "tags": [
          {
            "id": 0,
            "name": "string"
          }
        ],
        "status": "available"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

