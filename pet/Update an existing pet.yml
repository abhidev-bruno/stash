info:
  name: Update an existing pet
  type: http
  seq: 3
  tags:
    - pet

http:
  method: PUT
  url: swagger.io/pet
  body:
    type: json
    data: |-
      {
        "id": 0,
        "category": {
          "id": 0,
          "name": "string"
        },
        "name": "doggie",
        "photoUrls": [
          "string"
        ],
        "tags": [
          {
            "id": 0,
            "name": "string"
          }
        ],
        "status": "available"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: await bru.sendRequest('https://testbench-sanity.usebruno.com/ping')

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 400 Response
    description: Invalid ID supplied
    request:
      url: "{{baseUrl}}/pet"
      method: PUT
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Pet not found
    request:
      url: "{{baseUrl}}/pet"
      method: PUT
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 405 Response
    description: Validation exception
    request:
      url: "{{baseUrl}}/pet"
      method: PUT
    response:
      status: 405
      statusText: Method Not Allowed
      body:
        type: text
        data: ""
